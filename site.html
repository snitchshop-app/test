// ---------- цены ----------
const fmt = p => p.toLocaleString('pl-PL') + ' zł';
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const activeSale = id => { const d = todayStr(); return SALES.find(x => x.model === id && (!x.from || d >= x.from) && (!x.until || d <= x.until)) || null; };
const baseTiersOf = (catId, m) => m?.tiers || PRICING[catId]?.tiers || [];
function tiersOf(catId, m) {
  const base = baseTiersOf(catId, m), s = m ? activeSale(m.id) : null;
  if (!s) return base;
  const below = s.below || Infinity;
  return base.map(([q,p]) => q >= below ? [q,p] : [q, Math.max(0, s.percent ? Math.round(p*(1-s.percent/100)) : p-(s.off||0))]);
}
const modelMax = (cat, m) => { const x = baseTiersOf(cat.id, m); return x.length ? x[0][1] : 0; };
catalog.forEach(cat => { cat.models = cat.models.map((m,i)=>({m,i})).sort((a,b)=>(modelMax(cat,b.m)-modelMax(cat,a.m))||(a.i-b.i)).map(x=>x.m); });
const findModel = id => { for (const c of catalog) { const m = c.models.find(x => x.id === id); if (m) return { cat: c, m }; } return null; };
function priceText(cat, m) {
  const tt = tiersOf(cat.id, m); if (!tt.length) return '';
  const hi = tt[0][1], lo = tt[tt.length-1][1];
  return hi === lo ? `${hi} zł` : `${lo}–${hi} ${t('per_pcs')}`;
}
function priceHtml(cat, m) {
  const txt = priceText(cat, m), s = activeSale(m.id); if (!s) return txt;
  const o = baseTiersOf(cat.id, m), oh = o[0][1], ol = o[o.length-1][1], ot = oh === ol ? `${oh}` : `${ol}–${oh}`;
  return `<s style="color:#8b8b96;font-weight:500">${ot}</s> ` + txt;
}

let cart = {};
try { cart = JSON.parse(localStorage.getItem('sh_cart') || '{}') || {}; } catch(e) { cart = {}; }
const saveCart = () => { try { localStorage.setItem('sh_cart', JSON.stringify(cart)); } catch(e) {} };
const cartCount = () => Object.values(cart).reduce((s,i)=>s+i.qty, 0);
const pricingQty = () => Object.values(cart).reduce((s,i)=> (i.catId==='pods'||i.catId==='cartridges') ? s : s+i.qty, 0);
function unitPrice(item, total) {
  const f = findModel(item.model); if (!f) return 0;
  const tt = tiersOf(f.cat.id, f.m);
  if (f.cat.id === 'pods' || f.cat.id === 'cartridges') return tt[0]?.[1] || 0;
  let p = tt[0]?.[1] || 0; for (const [q,u] of tt) if (total >= q) p = u; return p;
}
const totalAt = T_ => Object.values(cart).reduce((s,i)=>s+i.qty*unitPrice(i,T_), 0);
const cartTotal = () => totalAt(pricingQty());
function cartSavings() {
  const T_ = pricingQty(); let s = 0;
  Object.values(cart).forEach(i => { const f = findModel(i.model); if (!f || f.cat.id==='pods' || f.cat.id==='cartridges') return; s += i.qty*((baseTiersOf(f.cat.id,f.m)[0]?.[1]||0) - unitPrice(i,T_)); });
  return s;
}
const deliveryCost = () => cartTotal() >= 2500 ? 40 : 25;
function upsell() {
  const T_ = pricingQty(); if (!T_) return '';
  let next = Infinity;
  Object.values(cart).forEach(i => { const f = findModel(i.model); if (!f || f.cat.id==='pods'||f.cat.id==='cartridges') return; tiersOf(f.cat.id,f.m).forEach(([q]) => { if (q > T_ && q < next) next = q; }); });
  if (next === Infinity || next > 200) return '';
  const save = totalAt(T_) - totalAt(next);
  const items = Object.values(cart).filter(i => { const f = findModel(i.model); return f && f.cat.id!=='pods' && f.cat.id!=='cartridges'; });
  const price = items.length ? unitPrice(items[0], next) : 0;
  return save > 0 ? `<div class="up">${t('upsell', next - T_, price, save)}</div>` : '';
}

let stockCache = {};
async function loadStock(model) {
  const skus = model.flavors.map(f => SKU_MAP[model.id + '::' + f]).filter(Boolean); if (!skus.length) return;
  try {
    const r = await fetch(`${PROXY_URL}/stock-bulk?skus=${encodeURIComponent(skus.join(','))}`), d = await r.json();
    Object.assign(stockCache, d.results || {});
    if (route().page === 'model') renderPage();
  } catch(e) {}
}
const stockOf = key => { const sku = SKU_MAP[key]; return sku && (sku in stockCache) ? stockCache[sku] : null; };
function nameOf(sku) { const it = Object.values(cart).find(i => SKU_MAP[i.key] === sku); return it ? `${it.modelName} ${it.flavor}` : sku; }
async function checkStock() {
  const need = {}; Object.values(cart).forEach(i => { const s = SKU_MAP[i.key]; if (s) need[s] = (need[s]||0) + i.qty; });
  const skus = Object.keys(need); if (!skus.length) return { ok: true };
  try {
    const r = await fetch(`${PROXY_URL}/stock-bulk?skus=${encodeURIComponent(skus.join(','))}`), d = await r.json();
    if (!r.ok || !d.results) return { ok:false, message:t('stock_connection_error') };
    for (const s of skus) if ((d.results[s] ?? 0) < need[s]) return { ok:false, message:t('stock_checkout_error', nameOf(s)) };
    return { ok: true };
  } catch(e) { return { ok:false, message:t('stock_connection_error') }; }
}
async function createOrder() {
  const T_ = pricingQty();
  const products = Object.values(cart).filter(i => SKU_MAP[i.key]).map(i => ({ name:`${i.modelName} ${i.flavor}`, sku:SKU_MAP[i.key], quantity:i.qty, price:unitPrice(i,T_) }));

  if (k !== lastKey) { if (r.page === 'info' && r.a) { const el = document.getElementById('sec-' + r.a); if (el) el.scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0); } else window.scrollTo(0, 0); }
  lastKey = k;
}
// ---------- модалка ----------
function showModal(msg) { const m = document.getElementById('modal'); m.innerHTML = `<div class="dlg card"><p style="color:var(--text);margin:6px 0 18px;font-size:16px">${msg}</p><a class="btn p lg" data-act="mclose">${t('ok')}</a></div>`; m.className = 'ov'; }
const closeModal = () => { document.getElementById('modal').className = 'ov hidden'; };
// ---------- возраст и язык ----------
function showGate() {
  const g = document.getElementById('gate'); if (ageOk() && hasLangOrChosen()) { g.className = 'ov hidden'; return; }
  g.className = 'ov';
  g.innerHTML = `<div class="dlg card"><div class="logo" style="justify-content:center;font-size:22px;margin-bottom:6px"><i style="background:none">${imgTag('images/logo-icon.webp')}</i>Snitch Shop</div>
  <div class="lg2"><div class="${lang==='pl'?'sel':''}" data-act="setlang" data-v="pl" role="button" tabindex="0">Polski</div><div class="${lang==='ru'?'sel':''}" data-act="setlang" data-v="ru" role="button" tabindex="0">Русский</div></div>
  <h2>${t('age_title')}</h2><p>${t('age_text')}</p><a class="btn p lg" data-act="ageyes">${t('age_yes')}</a><a class="btn lg" data-act="ageno">${t('age_no')}</a></div>`;
}
let _langChosen = hasLang; const hasLangOrChosen = () => _langChosen;
function setLang(l) { lang = l; _langChosen = true; try { localStorage.setItem('vl_lang', l); } catch(e) {} document.documentElement.lang = l; }
// ---------- действия ----------
function setQty(key, d) {
  const [mid, ...rest] = key.split('::'), flavor = rest.join('::'), f = findModel(mid); if (!f) return;
  const cur = cart[key]?.qty || 0, next = Math.max(0, cur + d);
  if (d > 0) {
    if (cartCount() + d > 200) { showModal(t('max_limit')); return; }
    const st = stockOf(key); if (st !== null) { if (st <= 0) { showModal(t('stock_limit_zero')); return; } if (next > st) { showModal(t('stock_limit_partial')); return; } }
  }
  if (next === 0) delete cart[key]; else cart[key] = { key, flavor, model: mid, modelName: f.m.name, category: catName(f.cat), catId: f.cat.id, qty: next };
  if (d > 0) track('add_to_cart', { m: mid, f: flavor });
  saveCart(); renderPage();
}
const val = id => (document.getElementById(id)?.value || '').trim();
function saveForm() { document.querySelectorAll('.fm input').forEach(el => { form[el.id] = el.value; }); }
async function confirmOrder() {
  saveForm();
  const total = cartTotal(), dc = deliveryCost(), count = cartCount();
  const T_ = pricingQty();
  let ol = ''; groupCart().forEach(g => { ol += g.modelName + '\n'; g.items.forEach(i => { ol += `${i.flavor} x${i.qty} - ${unitPrice(i, T_)} ZŁ\n`; }); ol += '\n'; });
  let msg = `${T.pl.msg_greeting}\n\n`, buyer, shipping = {}, deliveryLabel = '';
  if (payMethod === 'crypto') {
    buyer = { full_name: 'Криптовалюта — ожидает данные от менеджера', phone: '' };
    msg += `Kryptowaluta\nZAMÓWIENIE\n\n${ol}TOTAL: ${count} sztuk\nCENA: ${total} Zł\n\nCena dostawy: ${dc} Zł\nRazem do zapłaty: ${total}+${dc}=${total+dc} Zł`;
  } else {
    const name = val('f-name'), phoneRaw = val('f-phone'), city = val('f-miasto'), digits = phoneRaw.replace(/\D/g, '');
    if (!name || !phoneRaw || !city) { showModal(t('fill_required')); return; }
    if (digits.length < 9) { showModal(t('fill_phone')); return; }
    const phone = '+48 ' + digits.replace(/^48/, '').slice(-9).replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3');
    let dl = '';
    if (delivery === 'paczkomat') { const k = val('f-kodpacz'); if (!k || !/[a-zA-Z]/.test(k)) { showModal(t('fill_kod')); return; } dl = `Dostawa: Paczkomat InPost\nMiasto: ${city}\nKod paczkomatu: ${k}\n`; deliveryLabel = 'Paczkomat InPost · ' + k; }
    else if (delivery === 'zabka') { const z = val('f-zabka'); if (!z) { showModal(t('fill_zabka')); return; } dl = `Dostawa: Żabka\nMiasto: ${city}\nSklep Żabka / kod punktu: ${z}\n`; deliveryLabel = 'Żabka · ' + z; }
    else { const k = val('f-kod'), u = val('f-ulica'), b = val('f-budynek'), l = val('f-lokal'); if (!k || !u || !b) { showModal(t('fill_required')); return; } dl = `Dostawa: Kurier\nMiasto: ${city}\nKod pocztowy: ${k}\nUlica: ${u} ${b}${l ? ' / ' + l : ''}\n`; deliveryLabel = 'Kurier · ' + u + ' ' + b; }
    buyer = { full_name: name, phone }; shipping = { shipping_address_city: city };
    msg += `Pobranie\nZAMÓWIENIE\n\n${ol}TOTAL: ${count} sztuk\nCENA: ${total} Zł\n\nImię i Nazwisko: ${name}\nTelefon: ${phone}\n${dl}\nCena dostawy: ${dc} Zł\nRazem do zapłaty: ${total}+${dc}=${total+dc} Zł`;
  }
  const btn = document.querySelector('[data-act="confirm"]'); if (btn) btn.style.opacity = .6;
  const sc = await checkStock(); if (btn) btn.style.opacity = 1;
  if (!sc.ok) { showModal(sc.message); return; }
  pending = { buyer, shipping, pay: payMethod, total: total + dc, deliveryLabel, link: `https://t.me/${MANAGER_USERNAME}?text=${encodeURIComponent(msg)}` };
  orderCreated = false; go('#/done');
}
async function sendToManager(ev) {
  track('manager_click', { src: 'order' });
  if (orderCreated || !pending) return;
  ev.preventDefault(); if (busy) return; busy = true;
  const url = pending.link, r = await createOrder(); busy = false;
  if (!r.ok) { showModal(r.message); return; }
  orderCreated = true; track('order_submitted', { pay: pending.pay, total: cartTotal() });
  location.href = url;
}
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) { if (!ev.target.closest('header')) document.getElementById('mmenu')?.classList.remove('open'); return; }
  const a = el.dataset.act;
  if (a === 'inc') setQty(el.dataset.key, 1);
  else if (a === 'dec') setQty(el.dataset.key, -1);
  else if (a === 'lang') { setLang(lang === 'pl' ? 'ru' : 'pl'); renderPage(); }
  else if (a === 'setlang') { setLang(el.dataset.v); showGate(); renderPage(); }
  else if (a === 'menu') document.getElementById('mmenu').classList.toggle('open');
  else if (a === 'scroll') { ev.preventDefault(); document.getElementById('catalog')?.scrollIntoView({ behavior: 'smooth' }); }
  else if (a === 'pay') { saveForm(); payMethod = el.dataset.v; renderPage(); }
  else if (a === 'deliv') { saveForm(); delivery = el.dataset.v; renderPage(); }
  else if (a === 'confirm') confirmOrder();
  else if (a === 'send') sendToManager(ev);
  else if (a === 'neworder') { cart = {}; saveCart(); pending = null; orderCreated = false; Object.keys(form).forEach(k => delete form[k]); go('#/'); }
  else if (a === 'mclose') closeModal();
  else if (a === 'mgr') track('manager_click', { src: 'site' });
  else if (a === 'tgapp') track('tgapp_click', { src: 'site' });
  else if (a === 'ageyes') { setLang(lang); try { localStorage.setItem('sh_age18', '1'); } catch(e) { _ageMem = true; } showGate(); track('app_open', {}); }
  else if (a === 'ageno') { document.getElementById('gate').innerHTML = `<div class="dlg card"><h2>${t('sorry')}</h2><p>${t('sorry_text')}</p></div>`; }
  if (a !== 'menu') document.getElementById('mmenu')?.classList.remove('open');
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'flt') { flavorFilter = ev.target.value; renderPage(); }
  else if (ev.target.id === 'f-phone') { form['f-phone'] = ev.target.value; }
});
document.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[role=button][data-act]')) { ev.preventDefault(); ev.target.click(); } });
window.addEventListener('hashchange', onRoute);
document.documentElement.lang = lang;
showGate(); onRoute(); if (ageOk()) track('app_open', {});
