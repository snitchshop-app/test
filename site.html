// ---------- цены ----------
const fmt = p => p.toLocaleString('pl-PL') + ' zł';
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const activeSale = id => { const d = todayStr(); return SALES.find(x => x.model === id && (!x.from || d >= x.from) && (!x.until || d <= x.until)) || null; };
const baseTiersOf = (catId, m) => m?.tiers || PRICING[catId]?.tiers || [];
function tiersOf(catId, m) {
  const base = baseTiersOf(catId, m), s = m ? activeSale(m.id) : null;
  if (!s) return base;
  const below = s.below || Infinity;
  return base.map(([q,p]) => q >= below ? [q,p] : [q, Math.max(0, s.percent ? Math.round(p*(1-s.percent/100)) : p-(s.off||0))]);
}
const modelMax = (cat, m) => { const x = baseTiersOf(cat.id, m); return x.length ? x[0][1] : 0; };
catalog.forEach(cat => { cat.models = cat.models.map((m,i)=>({m,i})).sort((a,b)=>(modelMax(cat,b.m)-modelMax(cat,a.m))||(a.i-b.i)).map(x=>x.m); });
const findModel = id => { for (const c of catalog) { const m = c.models.find(x => x.id === id); if (m) return { cat: c, m }; } return null; };
function priceText(cat, m) {
  const tt = tiersOf(cat.id, m); if (!tt.length) return '';
  const hi = tt[0][1], lo = tt[tt.length-1][1];
  return hi === lo ? `${hi} zł` : `${lo}–${hi} ${t('per_pcs')}`;
}
function priceHtml(cat, m) {
  const txt = priceText(cat, m), s = activeSale(m.id); if (!s) return txt;
  const o = baseTiersOf(cat.id, m), oh = o[0][1], ol = o[o.length-1][1], ot = oh === ol ? `${oh}` : `${ol}–${oh}`;
  return `<s style="color:#8b8b96;font-weight:500">${ot}</s> ` + txt;
}

let cart = {};
try { cart = JSON.parse(localStorage.getItem('sh_cart') || '{}') || {}; } catch(e) { cart = {}; }
const saveCart = () => { try { localStorage.setItem('sh_cart', JSON.stringify(cart)); } catch(e) {} };
const cartCount = () => Object.values(cart).reduce((s,i)=>s+i.qty, 0);
const pricingQty = () => Object.values(cart).reduce((s,i)=> (i.catId==='pods'||i.catId==='cartridges') ? s : s+i.qty, 0);
function unitPrice(item, total) {
  const f = findModel(item.model); if (!f) return 0;
  const tt = tiersOf(f.cat.id, f.m);
  if (f.cat.id === 'pods' || f.cat.id === 'cartridges') return tt[0]?.[1] || 0;
  let p = tt[0]?.[1] || 0; for (const [q,u] of tt) if (total >= q) p = u; return p;
}
const totalAt = T_ => Object.values(cart).reduce((s,i)=>s+i.qty*unitPrice(i,T_), 0);
const cartTotal = () => totalAt(pricingQty());
function cartSavings() {
  const T_ = pricingQty(); let s = 0;
  Object.values(cart).forEach(i => { const f = findModel(i.model); if (!f || f.cat.id==='pods' || f.cat.id==='cartridges') return; s += i.qty*((baseTiersOf(f.cat.id,f.m)[0]?.[1]||0) - unitPrice(i,T_)); });
  return s;
}
const deliveryCost = () => cartTotal() >= 2500 ? 40 : 25;
function upsell() {
  const T_ = pricingQty(); if (!T_) return '';
  let next = Infinity;
  Object.values(cart).forEach(i => { const f = findModel(i.model); if (!f || f.cat.id==='pods'||f.cat.id==='cartridges') return; tiersOf(f.cat.id,f.m).forEach(([q]) => { if (q > T_ && q < next) next = q; }); });
  if (next === Infinity || next > 200) return '';
  const save = totalAt(T_) - totalAt(next);
  const items = Object.values(cart).filter(i => { const f = findModel(i.model); return f && f.cat.id!=='pods' && f.cat.id!=='cartridges'; });
  const price = items.length ? unitPrice(items[0], next) : 0;
  return save > 0 ? `<div class="up">${t('upsell', next - T_, price, save)}</div>` : '';
}
// ---------- склад ----------
let stockCache = {};
async function loadStock(model) {
  const skus = model.flavors.map(f => SKU_MAP[model.id + '::' + f]).filter(Boolean); if (!skus.length) return;
  try {
    const r = await fetch(`${PROXY_URL}/stock-bulk?skus=${encodeURIComponent(skus.join(','))}`), d = await r.json();
    Object.assign(stockCache, d.results || {});
    if (route().page === 'model') renderPage();
  } catch(e) {}
}
const stockOf = key => { const sku = SKU_MAP[key]; return sku && (sku in stockCache) ? stockCache[sku] : null; };
function nameOf(sku) { const it = Object.values(cart).find(i => SKU_MAP[i.key] === sku); return it ? `${it.modelName} ${it.flavor}` : sku; }
async function checkStock() {
  const need = {}; Object.values(cart).forEach(i => { const s = SKU_MAP[i.key]; if (s) need[s] = (need[s]||0) + i.qty; });
  const skus = Object.keys(need); if (!skus.length) return { ok: true };
  try {
    const r = await fetch(`${PROXY_URL}/stock-bulk?skus=${encodeURIComponent(skus.join(','))}`), d = await r.json();
    if (!r.ok || !d.results) return { ok:false, message:t('stock_connection_error') };
    for (const s of skus) if ((d.results[s] ?? 0) < need[s]) return { ok:false, message:t('stock_checkout_error', nameOf(s)) };
    return { ok: true };
  } catch(e) { return { ok:false, message:t('stock_connection_error') }; }
}
async function createOrder() {
  const T_ = pricingQty();
  const products = Object.values(cart).filter(i => SKU_MAP[i.key]).map(i => ({ name:`${i.modelName} ${i.flavor}`, sku:SKU_MAP[i.key], quantity:i.qty, price:unitPrice(i,T_) }));
  if (!products.length) return { ok: true };
  try {
    const r = await fetch(`${PROXY_URL}/order`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ buyer: pending.buyer, shipping: pending.shipping, products, campaign: getCampaign(), uid: getUid() }) });
    const d = await r.json();
    if (!r.ok) return { ok:false, message: d.error === 'insufficient_stock' ? t('stock_checkout_error', nameOf(d.sku)) : t('stock_order_failed') };
    return { ok: true };
  } catch(e) { return { ok:false, message:t('stock_connection_error') }; }
}

let _langChosen = hasLang; const hasLangOrChosen = () => _langChosen;

function setQty(key, d) {
  const [mid, ...rest] = key.split('::'), flavor = rest.join('::'), f = findModel(mid); if (!f) return;
  const cur = cart[key]?.qty || 0, next = Math.max(0, cur + d);
  if (d > 0) {
    if (cartCount() + d > 200) { showModal(t('max_limit')); return; }
    const st = stockOf(key); if (st !== null) { if (st <= 0) { showModal(t('stock_limit_zero')); return; } if (next > st) { showModal(t('stock_limit_partial')); return; } }
  }
  if (next === 0) delete cart[key]; else cart[key] = { key, flavor, model: mid, modelName: f.m.name, category: catName(f.cat), catId: f.cat.id, qty: next };
  if (d > 0) track('add_to_cart', { m: mid, f: flavor });

}
const val = id => (document.getElementById(id)?.value || '').trim();

  let msg = `${T.pl.msg_greeting}\n\n`, buyer, shipping = {}, deliveryLabel = '';

    else { const k = val('f-kod'), u = val('f-ulica'), b = val('f-budynek'), l = val('f-lokal'); if (!k || !u || !b) { showModal(t('fill_required')); return; } dl = `Dostawa: Kurier\nMiasto: ${city}\nKod pocztowy: ${k}\nUlica: ${u} ${b}${l ? ' / ' + l : ''}\n`; deliveryLabel = 'Kurier · ' + u + ' ' + b; }

async function sendToManager(ev) {

  else if (a === 'setlang') { setLang(el.dataset.v); showGate(); renderPage(); }

  else if (a === 'mgr') track('manager_click', { src: 'site' });
  else if (a === 'tgapp') track('tgapp_click', { src: 'site' });
